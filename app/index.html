<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Markdown Preview</title>
    <script>
      [
        ['shortcut icon', '/_static/favicon.ico', 'image/ico'],
        ['stylesheet', '/_static/page.css'],
        ['stylesheet', '/_static/markdown.css'],
        ['stylesheet', '/_static/highlight.css'],
        ['stylesheet', '/_static/katex@0.15.3.css']
      ].forEach(([rel, href, type]) => {
        const link = document.createElement('link')
        link.rel = rel
        link.href = href
        if (type) {
          link.type = type
        }
        document.head.append(link)
      })
    </script>
    <script>
      document.write([
        '/_static/mermaid.min.js',
        '/_static/katex@0.15.3.js',
        '/_static/mhchem.min.js',
        '/_static/raphael@2.3.0.min.js',
        '/_static/flowchart@1.13.0.min.js',
        '/_static/viz.js',
        '/_static/full.render.js'
      ].map(src => `<script src="${src}"><\/script>`).join(''))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
